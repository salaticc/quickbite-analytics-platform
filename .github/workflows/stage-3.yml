name: Stage 3 generation and ingestion

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-stage3.txt
      - name: Check generated business data
        run: python -m pytest -q -m "not integration"
      - name: Start databases
        run: docker compose up -d --wait --wait-timeout 180
      - name: Run integration smoke and replay
        env:
          QUICKBITE_INTEGRATION: "1"
        run: python -m pytest -q -s -m integration
      - name: Repeat the documented CLI sequence
        run: |
          python -m quickbite generate --profile smoke --seed 42 --output .quickbite-data/smoke
          python -m quickbite ingest --input .quickbite-data/smoke
          python -m quickbite verify
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove isolated CI containers and volumes
        if: always()
        run: docker compose down --volumes
